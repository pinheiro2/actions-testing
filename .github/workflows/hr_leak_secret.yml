name: Harden Runner Leak

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            www.wikipedia.org:443

      - name: Curl Wikipedia
        run: |
          echo "Attempting to reach Wikipedia..."
          curl -I https://www.wikipedia.org

      - name: Sus Activity
        run: |
          echo " Secret: ${{ secrets.SECRET2 }}"
          ${{ secrets.SECRET2 }}