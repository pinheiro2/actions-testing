name: Harden Runner File Tampering

on: workflow_dispatch

jobs:
  simulate-attack:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Source Code Tampering
        run: |
          # 1. Identify a file tracked by git (we assume README.md exists)
          # If README.md doesn't exist, this creates it so the next command counts as an overwrite
          if [ ! -f README.md ]; then echo "Initial Content" > README.md; fi

          # 2. OVERWRITE the file
          # Harden Runner flags this because a build script is modifying source code
          echo "MALICIOUS INJECTION: stealing_creds()" > README.md
          
          # 3. Modify a file in the .github folder (High Criticality)
          # This often triggers high-priority alerts
          if [ -d .github ]; then
             echo "malicious: true" > .github/compromised.yml
          fi