name: Harden Runner audit

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate Suspicious File Activity
        run: |
          # 1. Create a dummy source file
          mkdir -p src
          echo "console.log('Normal application code');" > src/app.js
          
          # 2. SIMULATE INJECTION: Append 'malicious' code to the source file
          # This triggers a "File Modification" event on tracked source code
          echo "eval('steal_credentials()'); // Malicious Injection" >> src/app.js
          
          # 3. SIMULATE DROPPER: Create a hidden script and make it executable
          # This triggers "File Creation" and "chmod" (permission change) events
          echo "#!/bin/bash\necho 'Mining crypto...'" > .hidden_miner.sh
          chmod +x .hidden_miner.sh
          
          # 4. SIMULATE EXFIL STAGING: Write to a sensitive-looking file
          # This triggers a write event to a potentially sensitive path
          echo "AWS_KEY=AKIA1234567890" > secrets.env